name: Android Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Name APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ZTMWidget.apk
      - uses: actions/upload-artifact@v5
        with:
          name: ztm-widget-apk
          path: dist/*.apk
          if-no-files-found: error
      # Stały link do najnowszego APK: Releases -> "latest" -> ZTMWidget.apk
      - name: Publish APK to GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=build-${{ github.run_number }}
          NOTES="Commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
          gh release create "$TAG" dist/*.apk --title "ZTM Widget build ${{ github.run_number }}" --notes "$NOTES" --target "$GITHUB_SHA" --latest
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
